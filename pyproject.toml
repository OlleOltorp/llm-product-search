[project]
name = "product-search"
version = "0.1.0"
description = "First-stage product retrieval on WANDS: BM25, embeddings and LLMs."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
]

[dependency-groups]
dev = [
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "mypy>=1.13",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/product_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
