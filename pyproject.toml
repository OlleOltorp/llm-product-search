[project]
name = "product-search"
version = "0.1.0"
description = "First-stage product retrieval on WANDS: BM25, embeddings and LLMs."
requires-python = ">=3.12,<3.13"
dependencies = [
    "bm25s>=0.3.13",
    "numpy>=2.5.4",
    "pandas>=2.2",
    "psutil>=7.2.2",
    "pyarrow>=17",
    "pystemmer>=3.1.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ir-measures>=0.4.3",
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "mypy>=1.13",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-psutil>=7.2.2.20260906",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/product_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["bm25s", "bm25s.*", "Stemmer"]
ignore_missing_imports = true
