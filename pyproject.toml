[project]
name = "product-search"
version = "0.1.0"
description = "First-stage product retrieval on WANDS: BM25, embeddings and LLMs."
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.0",
    "bm25s>=0.3.13",
    "numpy>=2.5.4",
    "pandas>=2.2",
    "psutil>=7.2.2",
    "pyarrow>=17",
    "pystemmer>=3.1.0",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.1.0",
    "transformers>=5.19.0",
]

# torch comes from the PyTorch index: `uv sync --extra cu130` on the GPU
# machine, `uv sync --extra cpu` elsewhere.
[project.optional-dependencies]
cpu = ["torch>=2.14.1"]
cu130 = ["torch>=2.14.1"]

[dependency-groups]
dev = [
    "ir-measures>=0.4.3",
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "mypy>=1.13",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-psutil>=7.2.2.20260906",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/product_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["bm25s", "bm25s.*", "Stemmer"]
ignore_missing_imports = true
