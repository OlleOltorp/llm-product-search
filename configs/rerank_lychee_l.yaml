# Lychee (KaLM-Reranker-V1): encoder reads the product, decoder reads the instruction and query.
# The repo code needs sentence-transformers >=5.6,<6; run with --with "sentence-transformers>=5.6,<6".
instruction: "Given a web search query, retrieve relevant passages that answer the query"
max_length: 1024
dtype: bfloat16
batch_size: 8
trust_remote_code: true
model_kwargs:
  chunk_size: 4
  # 15 GB in bf16 does not fit the 12 GB GPU; weights are loaded in 8-bit.
  quantization_config:
    quant_method: bitsandbytes
    load_in_8bit: true
